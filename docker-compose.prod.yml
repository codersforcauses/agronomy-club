services:
  db:
    image: postgres:16.4
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql/data
    env_file: ./.env.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    restart: unless-stopped
    env_file: ./.env.prod
    command:
      - start
      - --hostname=${KC_HOSTNAME}
      - --proxy-headers=${KC_PROXY_HEADERS:-xforwarded}
      - --http-enabled=${KC_HTTP_ENABLED:-true}
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8080}:8080"
      - "${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    volumes:
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      db:
        condition: service_healthy

  server:
    image: ghcr.io/codersforcauses/django-nextjs-template-prod-server:latest
    restart: unless-stopped
    env_file: ./.env.prod
    ports:
      - 8081:8081
    entrypoint: /entrypoint.sh
    volumes:
      - ./opt/accesslogs/:/var/log/accesslogs/
      - ./opt/static_files:/app/static_files
    environment:
      - DJANGO_SETTINGS_MODULE=api.settings
    depends_on:
      - db
      - keycloak

  client:
    image: ghcr.io/codersforcauses/django-nextjs-template-prod-client:latest
    restart: unless-stopped
    env_file: ./.env.prod
    ports:
      - 3000:3000
    entrypoint: /entrypoint.sh
    depends_on:
      - server

  nginx:
    image: nginx:stable-alpine3.21
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443

    volumes:
      - ./docker/nginx/custom.conf:/etc/nginx/nginx.conf
      - ./opt/static_files:/opt/static_files/
    depends_on:
      - server
      - client

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30
